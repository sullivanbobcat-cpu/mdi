[build]
  publish = "."
  command = "node scripts/build-notes.mjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/data/_schema.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/grain/*"
  to = "/grain-freight/"
  status = 301
