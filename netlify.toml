[build]
  publish = "."
  command = "node scripts/build-notes.mjs"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/data/_schema.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/grain/*"
  to = "/grain-freight/"
  status = 301

# Private energy model dashboard. Served from a separate, password-protected
# Netlify project (private repo); nothing from it is stored in this repository.
[[redirects]]
  from = "/model/*"
  to = "https://mdi-energy-model.netlify.app/:splat"
  status = 200
  force = true
