  <!-- Brand -->
  <text x="96" y="148" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="26" font-weight="600" letter-spacing="0.04em" fill="#8B949E">MARKET DATA INSIDER</text>

  <!-- Headline -->
  <text x="96" y="256" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="68" font-weight="700" fill="#FFD266" letter-spacing="-0.01em">Commodity fundamentals</text>
  <text x="96" y="336" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="68" font-weight="700" fill="#E6EDF3" letter-spacing="-0.01em">from public data</text>

  <!-- Sub-headline -->
  <text x="96" y="410" font-family="'Barlow', system-ui, sans-serif" font-size="28" font-weight="400" fill="#8B949E">Weekly numbers from USDA and EIA, in plain units,</text>
