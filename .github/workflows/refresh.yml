name: Refresh USDA barge data

on:
  schedule:
    - cron: "0 14 * * 2-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run refresh
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "mdi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
