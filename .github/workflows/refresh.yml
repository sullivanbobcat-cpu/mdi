name: Refresh market data

on:
  schedule:
    - cron: "0 16 * * 2-5"   # noon ET (11am in winter) Tue–Fri, after EIA's 10:30 releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Grain freight (USDA)
        run: npm run refresh
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: Energy (EIA)
        id: energy
        continue-on-error: true
        run: |
          if [ -z "$EIA_API_KEY" ]; then echo "::error::EIA_API_KEY secret is not set, energy data will not refresh"; exit 1; fi
          npm run refresh:energy
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "mdi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
      - name: Fail run if energy refresh failed
        if: steps.energy.outcome == 'failure'
        run: |
          echo "::error::Energy refresh failed. Grain data was still committed. Check the Energy (EIA) step log."
          exit 1
